services:

  web:
    build: .

    container_name: flask-app

    ports:
      - "5000:5000"

    env_file:
      - .env

    depends_on:
      - db

    networks:
      - backend

  db:
    image: postgres:15

    container_name: postgres-db

    env_file:
      - .env

    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - backend

volumes:
  db-data:

networks:
  backend: