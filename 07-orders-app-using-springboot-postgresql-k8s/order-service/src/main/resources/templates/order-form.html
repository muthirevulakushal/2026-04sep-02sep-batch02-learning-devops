<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Order - AWS Order Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-cancel {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
        }

        .error {
            color: #dc3545;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .field-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .form-row,
            .field-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Submit New Order</h1>
            <p>Fill in the form below to create an order</p>
        </div>

        <form method="post" th:object="${createOrderRequest}" th:action="@{/orders/submit}">
            <div th:if="${error}" class="error-message" th:text="${error}"></div>

            <div class="field-group">
                <div class="form-group">
                    <label for="customerId">Customer ID *</label>
                    <input type="text" id="customerId" th:field="*{customerId}" required>
                    <div class="error" th:if="${#fields.hasErrors('customerId')}" th:errors="*{customerId}"></div>
                </div>

                <div class="form-group">
                    <label for="customerEmail">Email Address *</label>
                    <input type="email" id="customerEmail" th:field="*{customerEmail}" required>
                    <div class="error" th:if="${#fields.hasErrors('customerEmail')}" th:errors="*{customerEmail}"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="productName">Product Name *</label>
                <input type="text" id="productName" th:field="*{productName}" required>
                <div class="error" th:if="${#fields.hasErrors('productName')}" th:errors="*{productName}"></div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="quantity">Quantity *</label>
                    <input type="number" id="quantity" th:field="*{quantity}" min="1" required>
                    <div class="error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
                </div>

                <div class="form-group">
                    <label for="unitPrice">Unit Price ($) *</label>
                    <input type="number" id="unitPrice" th:field="*{unitPrice}" step="0.01" min="0" required>
                    <div class="error" th:if="${#fields.hasErrors('unitPrice')}" th:errors="*{unitPrice}"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="shippingAddress">Shipping Address *</label>
                <input type="text" id="shippingAddress" th:field="*{shippingAddress}" required>
                <div class="error" th:if="${#fields.hasErrors('shippingAddress')}" th:errors="*{shippingAddress}"></div>
            </div>

            <div class="form-group">
                <label for="notes">Notes (Optional)</label>
                <textarea id="notes" th:field="*{notes}" placeholder="Add any special instructions..."></textarea>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-submit">✓ Submit Order</button>
                <a href="/" class="btn btn-cancel" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">← Back to Home</a>
            </div>
        </form>
    </div>
</body>
</html>
